<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#222823">
  <meta name="description" content="使用讓浪回家 Bring A Pet Home，查看朋友分享的收容所動物資料。">
  <meta name="apple-itunes-app" content="app-id=1536547532">
  <title>讓浪回家｜查看動物資料</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/animal-link.js" defer></script>
</head>
<body>
  <main>
    <h1>讓浪回家</h1>
    <p class="name">Bring A Pet Home</p>
    <p>朋友與你分享了一隻等待認養的動物。<br>在 App 中查看牠的詳細資料與收容所聯絡方式。</p>
    <p id="animal-reference" class="reference" aria-live="polite"></p>
    <div class="actions">
      <a id="open-app" class="button" hidden>在 App 中查看</a>
      <a class="store-link" href="https://apps.apple.com/app/id1536547532">前往 App Store 下載</a>
    </div>
    <p class="help">已安裝卻無法開啟？請用 Safari 開啟此頁，或更新 App 後再試一次。</p>
    <noscript><p>請啟用 JavaScript 後使用「在 App 中查看」，或先下載 App，再回到原分享連結。</p></noscript>
  </main>
</body>
</html>
